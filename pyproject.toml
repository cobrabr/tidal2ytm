[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tidal2ytm"
version = "0.7.0"
description = "Transfer liked tracks from Tidal to YouTube Music with accurate version matching."
requires-python = ">=3.11"
dependencies = [
    "tidalapi>=0.8.3",
    "ytmusicapi>=1.7.0",
    "tomli-w>=1.0.0",
    "rich>=13.0.0",
    "readchar>=4.2.0",
]

[project.scripts]
tidal2ytm = "tidal2ytm.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pyright>=1.1",
    "ruff>=0.9",
    "pre-commit>=4",
    # The sidecar is a workspace member, not a dependency of the CLI, so plain
    # `uv sync` would not install it and `uv sync --all-groups` would leave the
    # sidecar tests unable to import their own package.
    "tidal2ytm-sidecar",
]
# `sidecar/build_sidecar.ps1` builds the frozen sidecar. Exact, like every other
# pin here, and resolved through `uv.lock` rather than left to a second owner:
# `uv run --with` re-resolves from the index on every invocation, so the tool
# would be whatever is newest on the day, under a `.spec` file that documents the
# behaviour of the version that builds it. Windows-only, and no gate runs it.
build = ["pyinstaller==6.22.3"]

[tool.uv.workspace]
members = ["sidecar"]

[tool.uv.sources]
tidal2ytm-sidecar = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "sidecar/tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
# Both workspace members. `tidal2ytm_sidecar` was outside this list while its
# tests ran, so every regression in the sidecar's five production modules was
# invisible to the `fail_under` gate below.
source = ["tidal2ytm", "sidecar/tidal2ytm_sidecar"]
branch = true
[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.format]
exclude = ["docs/superpowers/**"]
[tool.ruff.lint]
select = ["E","F","W","C90","I","N","UP","S","B","SIM","RUF"]
ignore = ["S101"]
# The refresh test's double has to carry `access_token`, `refresh_token` and
# `token_type` as attribute names, because `persist_session` reads exactly those
# off a real `tidalapi.Session`; a stub with different names would be stubbing
# something other than the collaborator. The values are literals for the same
# reason: a fetch must not reach the network.
per-file-ignores = {"sidecar/tests/test_refresh.py" = ["S105", "S106"]}
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingImports = false
# The sidecar is a workspace member, not an installed dependency, so pyright has
# to be pointed at its source rather than at the editable install shim.
extraPaths = ["sidecar"]
