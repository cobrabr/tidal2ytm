[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tidal2ytm"
version = "0.1.0"
description = "Transfer liked tracks from Tidal to YouTube Music with accurate version matching."
requires-python = ">=3.11"
dependencies = [
    "tidalapi>=0.8.3",
    "ytmusicapi>=1.7.0",
    "tomli-w>=1.0.0",
    "rich>=13.0.0",
    "readchar>=4.2.0",
]

[project.scripts]
tidal2ytm = "tidal2ytm.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "pyright>=1.1", "ruff>=0.9", "pre-commit>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["tidal2ytm"]
branch = true
[tool.coverage.report]
# fail_under = 80  # enable in follow-up after sustained ≥80%
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E","F","W","C90","I","N","UP","S","B","SIM","RUF"]
ignore = ["S101"]
[tool.ruff.lint.mccabe]
max-complexity = 50
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "SIM117", "SIM105", "F841"]
[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingImports = false
reportPrivateUsage = false
reportUnknownLambdaType = false
reportPrivateImportUsage = false
reportConstantRedefinition = false
reportOptionalMemberAccess = false
reportUnnecessaryCast = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportMissingTypeArgument = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportCallIssue = false
reportAssignmentType = false
