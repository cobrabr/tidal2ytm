[workspace]
resolver = "3"
members = [
    "crates/tidal2ytm-core",
    "crates/tidal2ytm-ipc",
    "crates/tidal2ytm-store",
    "src-tauri",
]
# `tidal2ytm-store` is in `default-members` so a bare `cargo test` compiles and
# tests it, which is what keeps libsql linked and exercised on a runner with no
# webkit. Without that entry the crate would only ever be built as a dependency
# of the host, and a host that needs webkit is the one configuration CI cannot
# reach.
default-members = ["crates/tidal2ytm-core", "crates/tidal2ytm-ipc", "crates/tidal2ytm-store"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip` makes the parser round decimal floats to the nearest
# representable double instead of being up to one ULP out, which the golden
# corpus needs: it stores values Python printed at full precision, and the
# parity tests compare them exactly. It is on the workspace dependency rather
# than on one crate's dev-dependencies because Cargo unifies features across the
# graph, so the narrower declaration would state a smaller blast radius without
# being one, and `tidal2ytm-ipc` parses `f64` fields out of sidecar payloads and
# wants the correctly-rounded parser too.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.21"