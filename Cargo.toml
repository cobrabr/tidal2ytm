[workspace]
resolver = "3"
members = ["crates/tidal2ytm-core", "crates/tidal2ytm-ipc", "src-tauri"]
default-members = ["crates/tidal2ytm-core", "crates/tidal2ytm-ipc"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"