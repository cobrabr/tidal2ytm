repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
  # ruff is the project's own, from `uv.lock`, in the hook and in CI alike. It
  # used to be a `ruff-pre-commit` repo with its own `rev`, which is a second
  # owner for one gate: the hook's binary and the `check` job's were seven minor
  # versions apart, and nothing compared them, so a lint outcome that differs
  # between the two read green on commit and red in CI. There is deliberately no
  # version to bump here — `uv lock --upgrade` moves the one that exists, and
  # both gates run whatever it resolves to.
  - repo: local
    hooks:
      # No `args` and no `--fix`: this hook reports, and `ruff-format` below is
      # the one that rewrites. CI's whole-tree `ruff check .` is the backstop
      # for a file this per-staged-file pass never saw.
      - id: ruff
        name: ruff
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
        require_serial: true
      # Triggers only, never arguments: `pass_filenames: false` below means the
      # entry runs bare and the pattern merely decides whether it runs at all.
      # `.gitignore` and `.gitattributes` are here because Prettier reads the
      # first and its `endOfLine` default is `"lf"`, so editing either can change
      # which files pass `pnpm format:check`. `types_or: [javascript,
      # typescript]` would be wrong: pre-commit-identify classifies neither
      # `.svelte` nor these `.toml`/dotfiles that way, so a `types_or` filter
      # would silently exclude every component from formatting - a gate that
      # looks installed and never runs.
      - id: prettier
        name: prettier
        entry: pnpm format
        language: system
        files: '^(src/.*|index\.html|package\.json|tsconfig\.json|svelte\.config\.ts|vite\.config\.ts|vitest\.setup\.ts|eslint\.config\.ts|\.prettierrc\.toml|\.prettierignore|\.gitignore)$'
        pass_filenames: false
      # `eslint .` lints the root config files as well as `src/**`, so each of
      # them is a trigger: changing `eslint.config.ts` changes what `pnpm lint`
      # says. `--fix` rewrites and continues, matching the tool policy; CI's
      # `pnpm lint` is the backstop for anything it cannot fix.
      - id: eslint-fix
        name: eslint
        entry: pnpm lint:fix
        language: system
        files: '^(src/.*|eslint\.config\.ts|svelte\.config\.ts|vite\.config\.ts|vitest\.setup\.ts)$'
        pass_filenames: false
        require_serial: true
      # `files`, not `types: [python]`, for every hook below, because the file a
      # tool *owns* is not always one it *runs on* and pre-commit ANDs the two
      # filters. pre-commit-identify tags `pyproject.toml` as `pyproject` and
      # `Cargo.toml` as `cargo`, neither of which is `python` or `rust`, so a
      # manifest-only commit ran neither a Python nor a cargo gate — and
      # `pyproject.toml` is where `[tool.pyright]`, `[tool.pytest.ini_options]`
      # and `[tool.coverage.run]` all live. `contracts/**` is named by the two
      # suites that read it; pre-commit-identify calls it `json`, which is not a
      # Python or a Rust file either.
      #
      # `require_serial` on the two `uv run` hooks because they share one
      # environment: pre-commit runs distinct hooks concurrently, and four of
      # them asking uv to sync the same `.venv` at once is a lock fight over a
      # directory the commit is about to be made in. The cargo hooks below need
      # no equivalent — cargo locks its own target directory.
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        files: '\.(py|pyi)$|^pyproject\.toml$'
        stages: [pre-push]
        pass_filenames: false
        require_serial: true
      - id: pytest-push
        name: pytest
        entry: uv run pytest -q -x --cov --cov-fail-under=80
        language: system
        files: '\.(py|pyi)$|^pyproject\.toml$|^contracts/.*\.json$'
        stages: [pre-push]
        pass_filenames: false
        require_serial: true
      # None of the three hooks below compiles `src-tauri`: they name only the
      # two `default-members` crates, and `cargo fmt` reads manifests rather than
      # building. That is why none of them has to create
      # `src-tauri/binaries/tidal2ytm-sidecar-<triple>` and why the host is not
      # in the pre-push set - it is the one crate that needs a webkit toolchain.
      # Its tests run in the `host` CI job instead.
      #
      # `Cargo.lock` is absent from `cargo fmt` and present on the other two
      # because that is what each reads: `cargo fmt --all` walks the workspace
      # manifests to find members and targets, and dependency *resolution* is
      # what consults the lock.
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        files: '\.rs$|^Cargo\.toml$'
        stages: [pre-push]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy -p tidal2ytm-core -p tidal2ytm-ipc --all-targets --fix --allow-dirty -- -D warnings
        language: system
        files: '\.rs$|^Cargo\.(toml|lock)$'
        stages: [pre-push]
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: cargo test -p tidal2ytm-core -p tidal2ytm-ipc
        language: system
        files: '\.rs$|^Cargo\.(toml|lock)$|^contracts/.*\.json$'
        stages: [pre-push]
        pass_filenames: false
