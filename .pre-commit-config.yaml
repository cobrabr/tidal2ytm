repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
  # `check-github-workflows` validates `.github/workflows/*.yml` against the
  # SchemaStore GitHub Actions schema. `actionlint` is the usual choice and does
  # more, but its pre-commit hooks need Go or Docker (`language: golang`, or
  # `actionlint-docker`) and neither is installed on the machines this runs on,
  # so that hook would be installed and never run. This one needs nothing but
  # Python, which pre-commit already manages for `check-toml` above.
  #
  # It exists because a job-level `paths:` key is invalid — `paths` is a trigger
  # key, not a job key — and GitHub answers by creating no job at all and
  # failing the run in 0 seconds with the workflow file path as its name, which
  # looks nothing like a schema error. Nothing else catches it: `.github/` is
  # Prettier-ignored, and CI cannot be the backstop for this one, because an
  # invalid `ci.yml` means CI never starts to report it. This hook is the only
  # gate over the workflow files, so it runs at commit time.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
  # ruff is the project's own, from `uv.lock`, in the hook and in CI alike. It
  # used to be a `ruff-pre-commit` repo with its own `rev`, which is a second
  # owner for one gate: the hook's binary and the `check` job's were seven minor
  # versions apart, and nothing compared them, so a lint outcome that differs
  # between the two read green on commit and red in CI. There is deliberately no
  # version to bump here — `uv lock --upgrade` moves the one that exists, and
  # both gates run whatever it resolves to.
  - repo: local
    hooks:
      # `files`, not `types:`, for every hook below. pre-commit ANDs the two
      # filters, and pre-commit-identify tags `pyproject.toml` as `pyproject`
      # and `Cargo.toml` as `cargo` — neither `python` nor `rust` — so a
      # `types:` filter skipped every hook on a manifest-only commit, and
      # `pyproject.toml` is where `[tool.ruff]`, `[tool.ruff.format]`,
      # `[tool.ruff.lint]`, `[tool.pyright]`, `[tool.pytest.ini_options]` and
      # `[tool.coverage.run]` all live. `contracts/**` is named by the two
      # suites that read it; pre-commit-identify calls it `json`, which is not a
      # Python or a Rust file either.
      #
      # `pass_filenames: false` wherever the entry takes no path argument, so it
      # runs bare and `files` decides only whether it runs at all. On the two
      # ruff hooks that is also what lets a config-only commit *fail*:
      # `uv run ruff check --force-exclude pyproject.toml` exits 0 without
      # evaluating any config against any code, so `files` on its own would have
      # built a hook that fires and always passes.
      - id: ruff
        name: ruff
        entry: uv run ruff check --force-exclude
        language: system
        files: '\.(py|pyi)$|^pyproject\.toml$'
        pass_filenames: false
      # No `args` and no `--fix`: this hook reports, and `ruff-format` below is
      # the one that rewrites. Both now run bare over the whole tree, with the
      # same ruff and the same `pyproject.toml` that CI's `ruff check .` and
      # `ruff format --check .` use, so the only difference from CI is *when*
      # they run: a commit touching Python or `pyproject.toml`, rather than every
      # non-markdown commit. CI stays the backstop for the commits that skip
      # them.
      #
      # Bare `ruff format` also rewrites the Python code blocks inside `AGENTS.md`
      # and `README.md`, since ruff 0.16 formats Markdown. That is the same
      # scope CI's `ruff format --check .` already gates, so the hook and the
      # job agree instead of the hook being narrower. `docs/superpowers/**` is
      # excluded in `[tool.ruff.format]`.
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        files: '\.(py|pyi)$|^pyproject\.toml$'
        pass_filenames: false
      # Triggers only, never arguments: `pass_filenames: false` below means the
      # entry runs bare and the pattern merely decides whether it runs at all.
      # `.gitignore` and `.gitattributes` are here for two different reasons.
      # Prettier reads the first through its own default `--ignore-path`, which
      # is `.gitignore` and `.prettierignore`; `includeIgnoreFile` is
      # `@eslint/compat`'s and only `eslint.config.ts` uses it. Prettier never
      # reads the second — `* text=auto eol=lf` is what forbids CRLF in the
      # working tree, and Prettier's `endOfLine` default is `"lf"`, so the two
      # agree today and an `eol=crlf` would put every file out of format. Either
      # file can therefore change which files pass `pnpm format:check`.
      # `types_or: [javascript, typescript]` would be wrong: pre-commit-identify
      # gives `.svelte` a tag of its own and these `.toml`/dotfiles only `toml`,
      # so a `types_or` filter would silently exclude every component from
      # formatting — a gate that looks installed and never runs.
      - id: prettier
        name: prettier
        entry: pnpm format
        language: system
        files: '^(src/.*|index\.html|package\.json|tsconfig\.json|svelte\.config\.ts|vite\.config\.ts|vitest\.setup\.ts|eslint\.config\.ts|\.prettierrc\.toml|\.prettierignore|\.gitignore|\.gitattributes)$'
        pass_filenames: false
      # `eslint .` lints the root config files as well as `src/**`, so each of
      # them is a trigger: changing `eslint.config.ts` changes what `pnpm lint`
      # says. `--fix` rewrites and continues, matching the tool policy; CI's
      # `pnpm lint` is the backstop for anything it cannot fix.
      - id: eslint-fix
        name: eslint
        entry: pnpm lint:fix
        language: system
        files: '^(src/.*|eslint\.config\.ts|svelte\.config\.ts|vite\.config\.ts|vitest\.setup\.ts)$'
        pass_filenames: false
      # No hook here sets `require_serial`, and none should. pre-commit runs
      # distinct hooks one after another (`pre_commit/commands/run.py` is a plain
      # `for hook in hooks:`), so there is never more than one of these entries
      # live at a time. `require_serial` sets `jobs = 1` for the parallelism
      # *within* one hook across its file batches, and `pass_filenames: false`
      # leaves each of them with no files to batch — `xargs.partition` returns a
      # single command — so the setting could not change what any of them does.
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        files: '\.(py|pyi)$|^pyproject\.toml$'
        stages: [pre-push]
        pass_filenames: false
      - id: pytest-push
        name: pytest
        entry: uv run pytest -q -x --cov --cov-fail-under=80
        language: system
        files: '\.(py|pyi)$|^pyproject\.toml$|^contracts/.*\.json$'
        stages: [pre-push]
        pass_filenames: false
      # None of the three hooks below compiles `src-tauri`: they name only the
      # two `default-members` crates, and `cargo fmt` reads manifests rather than
      # building. That is why none of them has to create
      # `src-tauri/binaries/tidal2ytm-sidecar-<triple>` and why the host is not
      # in the pre-push set - it is the one crate that needs a webkit toolchain.
      # Its tests run in the `host` CI job instead.
      #
      # `Cargo.lock` is absent from `cargo fmt` and present on the other two
      # because that is what each reads: `cargo fmt --all` walks the workspace
      # manifests to find members and targets, and dependency *resolution* is
      # what consults the lock.
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        files: '\.rs$|^Cargo\.toml$'
        stages: [pre-push]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy -p tidal2ytm-core -p tidal2ytm-ipc --all-targets --fix --allow-dirty -- -D warnings
        language: system
        files: '\.rs$|^Cargo\.(toml|lock)$'
        stages: [pre-push]
        pass_filenames: false
      - id: cargo-test
        name: cargo test
        entry: cargo test -p tidal2ytm-core -p tidal2ytm-ipc
        language: system
        files: '\.rs$|^Cargo\.(toml|lock)$|^contracts/.*\.json$'
        stages: [pre-push]
        pass_filenames: false
