name: ci
on:
  push:
    paths-ignore: ['**.md']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # `--locked`, not `--frozen`: `--frozen` installs whatever `uv.lock` says
      # and never compares it to `pyproject.toml`, so a manifest edit that was
      # never re-locked passes this step and every Python gate below then runs
      # against a dependency set the manifest does not describe. `--locked`
      # asserts they agree and fails when they do not.
      - run: uv sync --all-groups --locked
      - run: uv run pre-commit run check-toml --all-files
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest --cov --cov-fail-under=80 --cov-report=xml --cov-report=term-missing
      - run: uv run coverage report --format=markdown --show-missing --skip-covered >> "$GITHUB_STEP_SUMMARY"
      - run: uvx vulture tidal2ytm --min-confidence 80
        continue-on-error: true

  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      host: ${{ steps.filter.outputs.host }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      # `dorny/paths-filter` lists changed files through the REST API on
      # `pull_request`, and through `git` against the merge-base with the default
      # branch on `push`. Only the second needs a workspace, so this checkout is
      # here for the pushes and harmless on a pull request.
      - uses: actions/checkout@v5
      # The three filters below are the per-job `paths:` lists this workflow used
      # to carry. `paths` is a trigger key, not a job key: a job-level one is
      # rejected by GitHub's workflow schema and makes the whole file invalid, so
      # GitHub creates no job at all and the run fails in 0 seconds with the file
      # path as its name. The action computes the same decision once and the jobs
      # read it through `if:`.
      #
      # `rust` is every path that can make the `rust` job fail. `crates/**` is
      # the job's reason to exist, and `host` lists it too because `host` is the
      # only job that compiles `src-tauri` or runs its tests, so a crate change
      # runs `rust` for the crates themselves and `host` for what consumes them.
      # A rename the round-trip suite also imports turns both red - neither
      # entry is the only thing between a crate change and a red run - but drop
      # this one and the two crates' own tests stop running anywhere: `host` runs
      # the host's tests, not theirs, and `check` has no Rust steps. `host` still
      # compiles and lints them, because `cargo clippy -p tidal2ytm` reaches
      # `tidal2ytm-ipc` as a workspace dependency, but that is the library only -
      # not `tidal2ytm-core`, which is outside that dependency graph, and not a
      # test target, which is where `round_trip.rs` lives. `contracts/**` is read
      # by `protocol.rs` and `round_trip.rs`, and `sidecar/**` is spawned by
      # `round_trip.rs`, so both can turn this job red without touching Rust.
      # `pyproject.toml`/`uv.lock` gate the `uv sync` that provides the venv the
      # round trip launches.
      #
      # `host` is everything that job builds or executes. `contracts/**` because
      # `state.rs`'s tests read `auth_status.json`; the build config files
      # because `pnpm build` loads them; `.npmrc` because it is what makes
      # `pnpm install` refuse the wrong Node. `crates/**` because `src-tauri` is
      # a consumer of `tidal2ytm-ipc` and this job is the only one that compiles
      # it or runs its tests: `rust`'s share of a crate is clippy, that crate's
      # own tests, and a workspace-wide `cargo fmt --all --check`, and none of
      # those three compiles `src-tauri` - renaming `IpcError::Spawn`'s field
      # leaves `cargo fmt --all --check` at exit 0 while `cargo test -p
      # tidal2ytm` will not compile. A rename the round trip happens to import
      # turns `rust` red as well, so this entry is not the only thing between a
      # crate change and a red run; it is the only thing between a crate change
      # and a host that was built at all. `sidecar/**` because `sidecar_path.rs`
      # requires `sidecar/tidal2ytm_sidecar/__init__.py` to exist for the
      # checkout fallback and its own test asserts it does; rename or move that
      # one file and this job is red. Lint-only and formatting-only frontend
      # config (`.prettierrc.toml`, `.prettierignore`, `eslint.config.ts`,
      # `vitest.setup.ts`) cannot break this job and are left to `frontend`.
      #
      # `frontend` is every path that can make that job fail. `.gitignore` and
      # `.gitattributes` are here because Prettier reads the former and its
      # `endOfLine` default is `"lf"`, so a change to either changes which files
      # pass `format:check`. `contracts/**` because `src/lib/types.ts` imports
      # it, so a rename there is a type error. `vitest.config.ts` is deliberately
      # absent: Task 9 folded it into `vite.config.ts`, which is listed.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'contracts/**'
              - 'sidecar/**'
              - 'pyproject.toml'
              - 'uv.lock'
            host:
              - 'src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'contracts/**'
              - 'sidecar/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.npmrc'
              - 'svelte.config.ts'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'index.html'
              - 'src/**'
            frontend:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.npmrc'
              - '.gitignore'
              - '.gitattributes'
              - '.prettierrc.toml'
              - '.prettierignore'
              - 'svelte.config.ts'
              - 'vite.config.ts'
              - 'vitest.setup.ts'
              - 'tsconfig.json'
              - 'eslint.config.ts'
              - 'contracts/**'
              - 'index.html'
              - 'src/**'

  rust:
    name: rust
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./crates/tidal2ytm-core,./crates/tidal2ytm-ipc
      # `--all-packages`, not `--all-groups`: this job needs the *workspace
      # member* `tidal2ytm_sidecar` importable for `round_trip.rs`, and
      # `--all-packages` is what installs a member. `--all-groups` only happens
      # to install it today through the `dev` group entry in `pyproject.toml`.
      # `--locked` for the reason given on the `check` job's line above.
      - run: uv sync --all-packages --locked
      # No step to locate the interpreter. `interpreter.rs` prefers
      # `<root>/.venv/{bin/python,Scripts/python.exe}`, which the `uv sync` above
      # creates on both platforms, and `round_trip.rs` passes with
      # `TIDAL2YTM_SIDECAR_PYTHON` unset - verified, not assumed. Pinning it
      # here to whatever `uv run python` resolves would hide that fallback from
      # the one thing it exists for: a checkout whose `PATH` python has neither
      # the sidecar nor `tidalapi` in it.
      - run: cargo fmt --all --check
      - run: cargo clippy -p tidal2ytm-core -p tidal2ytm-ipc --all-targets -- -D warnings
      - run: cargo test -p tidal2ytm-core -p tidal2ytm-ipc

  host:
    name: host
    needs: changes
    if: ${{ needs.changes.outputs.host == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri
      - name: install the Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      # No `version:` here or below. `packageManager` in package.json is the one
      # owner of the pnpm pin; pnpm/action-setup reads it, and passing a second
      # literal is a second place for the two to disagree.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `tauri_build` resolves `bundle.externalBin` to
      # `src-tauri/binaries/tidal2ytm-sidecar-<triple>` plus `.exe` on Windows,
      # and refuses to compile at all when that file is absent. It is gitignored,
      # so every checkout has to recreate it. An empty file is enough: the build
      # script copies it beside the binary and nothing here runs it. Bundling a
      # real executable is `sidecar/build_sidecar.ps1`, which runs PyInstaller
      # and is Windows-only, so this step deliberately does not run it.
      #
      # `rustc -vV`'s host is what the build script reads, because no `--target`
      # is passed to cargo here. If a `--target` is ever added to this job, derive
      # that triple instead or this step stops satisfying the build script.
      - name: create the sidecar placeholder
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          case "$triple" in
            *windows*) suffix=".exe" ;;
            *) suffix="" ;;
          esac
          mkdir -p src-tauri/binaries
          : > "src-tauri/binaries/tidal2ytm-sidecar-${triple}${suffix}"
      # `cargo fmt --all` covers every workspace member, `src-tauri/` included.
      # The `rust` job runs it too but is filtered out of `src-tauri/**`, so
      # without this line a formatting error in the host would be gated by
      # nothing.
      - run: cargo fmt --all --check
      - run: cargo clippy -p tidal2ytm --all-targets -- -D warnings
      # The host's own tests - including `state.rs`'s startup-failure contract -
      # have no other executor. `src-tauri` is outside `Cargo.toml`'s
      # `default-members`, so a bare `cargo test` never compiles it.
      - run: cargo test -p tidal2ytm

  frontend:
    name: frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
