[package]
name = "tidal2ytm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Tauri host for tidal2ytm. Owns the domain core and the sidecar."

[lib]
name = "tidal2ytm_host"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
# Pinned to the `@tauri-apps/cli` version in package.json. The two are released
# in lockstep and a caret on either lets a routine `cargo update` drift them.
tauri = { version = "2.12.1", features = [] }
# The host's log facade. Phase 4 replaces the sink with the per-run log file;
# the facade is what makes "log this at DEBUG" expressible in the meantime.
log = "0.4"
serde.workspace = true
serde_json.workspace = true
# `TrackStatus` is named in `counts_by_name`'s signature and in its test, so the
# dependency is direct rather than reached through `tidal2ytm-store`.
tidal2ytm-core = { path = "../crates/tidal2ytm-core" }
tidal2ytm-ipc = { path = "../crates/tidal2ytm-ipc" }
tidal2ytm-store = { path = "../crates/tidal2ytm-store" }
# `sync` for the mutex that serialises a respawn and `rt` for the sync job's
# own single-threaded runtime on its worker thread. The command surface's
# runtime itself belongs to Tauri; naming what this crate starts itself keeps
# the claim visible rather than feature-unified into existence.
tokio = { workspace = true, features = ["sync", "rt"] }

[dev-dependencies]
# `macros` and `rt` for `#[tokio::test]`, which `state.rs` and `lib.rs`'s tests
# need because `AppState::start` and `open_database` are async. Named here
# rather than relied on through feature unification with `tidal2ytm-ipc`: this
# crate's own test requirement belongs in this crate's own manifest, and a
# unification that silently supplied it would end the day that dependency's
# feature list changed.
tokio = { workspace = true, features = ["macros", "rt"] }
